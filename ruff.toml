target-version = "py311"
line-length = 88

[lint]
select = ["E", "F", "I", "UP", "B", "PIE", "RUF"]
ignore = [
    "BLE001", # broad excepts are intentional around third-party/IO calls
    "E501",   # line length is handled by the formatter/review
    "RUF001", # German text intentionally uses en dashes
]
