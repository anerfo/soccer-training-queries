[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-training-queries"
version = "0.1.0"
description = "WhatsApp training poll bot with calendar-driven scheduling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neonize==0.5.2",
    "flask==3.1.3",
    "tzdata>=2024.1",
    "PyJWT[crypto]>=2.8",
    "recurring-ical-events>=3.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "coverage>=7.6",
    "mypy>=1.10",
    "vulture>=2.11",
    "radon>=6.0",
    "pylint>=4.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
docs = ["mkdocs>=1.6"]

[project.scripts]
soccer-bot = "soccer.daemon:main"

[tool.setuptools.packages.find]
include = ["soccer*"]

[tool.setuptools.package-data]
soccer = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PIE", "RUF"]
ignore = ["BLE001", "E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["wa.py", "soccer"]
exclude = ["^tests/", "^\\.venv/", "^data/"]

[tool.coverage.run]
omit = [".venv/*", "data/*", "tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]
