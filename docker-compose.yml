services:
  wa:
    build:
      context: .
      args:
        UID: ${WA_UID:-1000}
        GID: ${WA_GID:-1000}
    image: whatsapp-agent:latest
    init: true
    restart: on-failure:3
    stop_grace_period: 20s
    command: ["python", "wa.py", "serve", "--web-host", "0.0.0.0"]
    environment:
      WA_GROUP: ${WA_GROUP:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_TOKEN_AUTH_METHOD: ${OIDC_TOKEN_AUTH_METHOD:-client_secret_basic}
      OIDC_LOGOUT_URL: ${OIDC_LOGOUT_URL:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_ALGORITHMS: ${OIDC_ALGORITHMS:-RS256,ES256,PS256}
      OIDC_LEEWAY: ${OIDC_LEEWAY:-30}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-}
    ports:
      - "0.0.0.0:8024:8080"
    volumes:
      - ./data:/app/data
      - ./polls.txt:/app/polls.txt
    healthcheck:
      test: ["CMD", "python", "wa.py", "status", "--timeout", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
